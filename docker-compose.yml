services:
  db:
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD" ]
      timeout: 20s
      retries: 5
      interval: 5s
      start_period: 20s
    image: mysql:latest
    container_name: hrr-local_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD : ${LOCAL_DB_PASSWORD}
      MYSQL_DATABASE : hrr-server
      MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: caching_sha2_password

    volumes:
      - db-data:/var/lib/mysql

  redis-server:
    image: redis:7.4.2-alpine
    container_name: hrr_redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data    # 영속성 유지

  model-api:
    build: ../Hrr-model/hrr-RecSys
    image: hrr/model-api
    container_name: hrr-model-api
    platform: linux/amd64
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

volumes:
  db-data:
  redis_data:

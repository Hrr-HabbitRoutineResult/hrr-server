name: Deploy to AWS EC2 with Docker

on:
  push:
    branches: [ "develop" ] # develop 브랜치에 푸시하면 자동으로 배포 시작
  pull_request:
    branches: [ "develop" ] # PR 생성 시 빌드/테스트 진행
  workflow_dispatch:    # 수동 가능하게

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v3

      # 자바 세팅 (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle 빌드 (테스트 스킵)
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      # Docker Buildx 설치 (for Mac의 ARM64 아키텍처 호환)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 도커 로그인 (Access Token 사용)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # 도커 이미지 빌드 & 푸시 (linux/amd64 강제 지정)
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/hrr-server:latest
          platforms: linux/amd64

      # 설정 파일(docker-compose, nginx, deploy) EC2로 전송 (SCP)
      - name: Copy Configuration files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          # source: 깃헙에 있는 파일 경로 / target: EC2 저장 경로
          source: "docker-compose_prod.yml,nginx.conf, deploy.sh"
          target: "/home/ubuntu"

      # EC2 접속해서 deploy.sh(베포 스크립트) 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu
            chmod +x deploy.sh
            ./deploy.sh

events {
    worker_connections 1024;    # worker 프로세서가 동시에 처리할 수 있는 최대 연결 수 설정
}

http {
    # Spring Boot 컨테이너와 통신 설정
    upstream app_server {
        # 'app'은 docker-compose.yml에 정의된 서비스 이름
        server app:8080;
    }

    server {
        listen 80; # Nginx 컨테이너의 내부 포트
        server_name localhost; # 개발 환경에서는 localhost로 설정

        # 모든 요청을 Spring Boot 앱으로 전달하는 설정
        location / {
            proxy_pass http://app_server;

            # 클라이언트의 실제 IP와 HTTPS 정보를 Spring Boot 앱에 전달
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

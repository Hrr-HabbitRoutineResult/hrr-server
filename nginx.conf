events {
    worker_connections 1024;    # worker 프로세서가 동시에 처리할 수 있는 최대 연결 수 설정
}

http {
    # Spring Boot 컨테이너와 통신 설정
    # 도커 내장 DNS 서버 설정 - 30초마다 'app'의 IP가 바뀌었는지 다시 확인
    resolver 127.0.0.11 valid=30s;

    # HTTP 처리
    server {
        listen 80; # Nginx 컨테이너의 내부 포트
        server_name www.hrr-umc7.store hrr-umc7.store;

        # Certbot 인증을 위한 경로 설정
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 나머지 모든 HTTP 요청을 HTTPS로 301 영구 리다이렉트
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 처리 서버
    server {
        listen 443 ssl;
        server_name www.hrr-umc7.store hrr-umc7.store;

        # Certbot으로 발급받은 인증서 경로 지정
        ssl_certificate /etc/letsencrypt/live/www.hrr-umc7.store/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.hrr-umc7.store/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;

        # 모든 요청을 Spring Boot 앱으로 전달하는 설정
        location / {
            # 변수를 사용하여 proxy_pass 설정
            # 주소를 변수에 담아서 사용해야 Nginx가 위에서 설정한 resolver를 통해 IP를 재조회
            # service-env.inc는 반드시 'set $service_url http://서비스명:포트;' 형식을 지켜야 함
            # 프로토콜(http://)이 누락되면 Nginx가 정상적으로 프록시를 수행할 수 없음
            include /etc/nginx/conf.d/service-env.inc; # 컨테이너 내부 경로에서 설정 파일 불러오기
            proxy_pass $service_url;

            # 클라이언트의 실제 IP와 HTTPS 정보를 Spring Boot 앱에 전달
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https; # HTTPS 사용 명시
        }
    }
}

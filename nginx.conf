events {
    worker_connections 1024;    # worker 프로세서가 동시에 처리할 수 있는 최대 연결 수 설정
}

http {
    # Spring Boot 컨테이너와 통신 설정
    upstream app_server {
        # 'app'은 docker-compose.yml에 정의된 서비스 이름
        server app:8080;
    }

    # HTTP 처리
    server {
        listen 80; # Nginx 컨테이너의 내부 포트
        server_name www.hrr-umc7.store hrr-umc7.store;

        # Certbot 인증을 위한 경로 설정
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 나머지 모든 HTTP 요청을 HTTPS로 301 영구 리다이렉트
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 처리 서버
    server {
        listen 443 ssl;
        server_name www.hrr-umc7.store hrr-umc7.store;

        # Certbot으로 발급받은 인증서 경로 지정
        ssl_certificate /etc/letsencrypt/live/www.hrr-umc7.store/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.hrr-umc7.store/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;

        # 모든 요청을 Spring Boot 앱으로 전달하는 설정
        location / {
            proxy_pass http://app_server;

            # 클라이언트의 실제 IP와 HTTPS 정보를 Spring Boot 앱에 전달
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https; # HTTPS 사용 명시
        }
    }
}

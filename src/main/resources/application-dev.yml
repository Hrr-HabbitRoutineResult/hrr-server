spring:
  config:
    activate:
      on-profile: "dev"
  jpa:
    hibernate:
      ddl-auto: update

  flyway:
    locations: classpath:db/migration, classpath:db/seed/dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}

springdoc:
  server-url: ${DEV_BASE_URL}

jwt:
  secret : ${JWT_SECRET}
  access-token-validity : 2592000000           # 임시
  refresh-token-validity : 2592000000       # 임시

#카카오 로그인
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${DEV_KAKAO_REDIRECT_URI}  # 예: https://api.hrr-dev.com/api/auth/kakao/callback
  client-secret: ${KAKAO_CLIENT_SECRET}
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
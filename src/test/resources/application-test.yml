spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE;INIT=CREATE DOMAIN IF NOT EXISTS TEXT AS CLOB\;CREATE DOMAIN IF NOT EXISTS LONGBLOB AS BLOB
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # 테스트 후 삭제
    properties:
          hibernate:
            globally_quoted_identifiers: true
  config:
    activate:
      on-profile: "test"

  flyway:
    enabled: false

  task:
    scheduling:
      enabled: false

springdoc:
  server-url: http://localhost:8080

jwt:
  secret : test-secret-for-jwt-placeholder-resolution
  access-token-validity : 1800000           # 1000L * 60 * 30 (30분)
  refresh-token-validity : 604800000       # 1000L * 60 * 60 * 24 * 7 (7일)

firebase:
  config:
    path: firebase/hrr-server-firebase-adminsdk-fbsvc-4630feba48.json

#카카오 로그인
kakao:
  admin-key: ${KAKAO_ADMIN_KEY:dummy-kakao-admin-key}
  client-id: ${KAKAO_CLIENT_ID:dummy-kakao-id}
  redirect-uri: ${DOCKER_KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
  client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-secret}
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
  #redirect-uri: ${DOCKER_KAKAO_REDIRECT_URI:hrr://oauth/kakao}

apple:
  team-id: ${APPLE_TEAM_ID:dummy-apple-team-id}
  client-id: ${APPLE_CLIENT_ID:dummy-apple-client-id}
  key-id: ${APPLE_KEY_ID:dummy-apple-key-id}
  p8-key: ${APPLE_P8_KEY:dummy-apple-p8-key}

naver:
  client-id: ${NAVER_CLIENT_ID:dummy-naver-client-id}
  client-secret: ${NAVER_CLIENT_SECRET:dummy-naver-client-secret}

aws:
  s3:
    region: ap-northeast-2
    bucket: test-bucket
    prefix: test/
    url-prefix: https://example.com/

model:
  api:
    url: http://localhost:8000/recommend
    embedding-url: http://localhost:8000/embedding
